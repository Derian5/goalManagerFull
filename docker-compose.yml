services:
  # База данных
  db:
    image: postgres:15
    restart: always
    networks:
      - app-network
    env_file:
      - ./.env # Рекомендуется вынести переменные в .env файл
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Бэкенд API
  api:
    image: ghcr.io/derian5/goalmanagerfull-api:latest
    build: ./backend
    restart: always
    networks:
      - app-network
    env_file:
      - ./.env
    depends_on:
      - db
    # Не публикуем порт 8000 наружу, так как доступ к API будет идти только через Nginx

  # Фронтенд + Обратный прокси
  frontend:
    image: ghcr.io/derian5/goalmanagerfull-frontend:latest
    build: ./frontend
    restart: always
    networks:
      - app-network
    ports:
      - "80:80"   # Публикуем 80-й порт Nginx на основном порту сервера
      - "443:443" # Сюда позже добавим HTTPS
    # Здесь можно добавить конфигурацию Nginx для проксирования запросов к API
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d # Для кастомной конфигурации Nginx

volumes:
  postgres_data:
networks:
  app-network:
    driver: bridge
