name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  API_IMAGE: ghcr.io/derian5/goalmanagerfull-api
  FRONTEND_IMAGE: ghcr.io/derian5/goalmanagerfull-frontend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            cd "${{ secrets.SERVER_PROJECT_PATH }}"

            docker --version
            if docker compose version >/dev/null 2>&1; then
              docker compose version
              echo "Using docker compose"
              COMPOSE="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              docker-compose --version
              echo "Using docker-compose"
              COMPOSE="docker-compose"
            else
              echo "Docker Compose is not installed on the server"
              exit 1
            fi

            DOMAIN="goalmanager.work.gd"
            CERT_PATH="./certbot/conf/live/$DOMAIN/fullchain.pem"

            if [ ! -f "$CERT_PATH" ]; then
              echo "Issuing initial Let's Encrypt certificate for $DOMAIN"
              $COMPOSE stop frontend || true
              mkdir -p ./certbot/conf ./certbot/www ./certbot/lib
              docker rm -f goalmanager-certbot-webroot >/dev/null 2>&1 || true
              docker run -d \
                --name goalmanager-certbot-webroot \
                -p 80:80 \
                -v "$(pwd)/certbot/www:/usr/share/nginx/html" \
                nginx:alpine

              if ! docker run --rm \
                -v "$(pwd)/certbot/www:/var/www/certbot" \
                -v "$(pwd)/certbot/conf:/etc/letsencrypt" \
                -v "$(pwd)/certbot/lib:/var/lib/letsencrypt" \
                certbot/certbot:latest certonly \
                --webroot \
                -w /var/www/certbot \
                --non-interactive \
                --agree-tos \
                --register-unsafely-without-email \
                -d "$DOMAIN"; then
                docker rm -f goalmanager-certbot-webroot >/dev/null 2>&1 || true
                echo "Failed to issue certificate; restoring the current frontend container"
                $COMPOSE up -d frontend || true
                exit 1
              fi

              docker rm -f goalmanager-certbot-webroot >/dev/null 2>&1 || true
            fi

            git fetch origin main
            git pull --ff-only origin main

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            $COMPOSE pull api frontend
            $COMPOSE up -d db
            $COMPOSE run --rm api alembic upgrade head
            $COMPOSE up -d --no-build --remove-orphans db api frontend
            $COMPOSE run --rm certbot renew --webroot -w /var/www/certbot --non-interactive || true
            $COMPOSE exec -T frontend nginx -s reload || true
