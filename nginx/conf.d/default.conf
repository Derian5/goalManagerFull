server {
    listen 80;
    server_name goalmanager.work.gd;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name goalmanager.work.gd;

    ssl_certificate /etc/letsencrypt/live/goalmanager.work.gd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goalmanager.work.gd/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    resolver 127.0.0.11 valid=30s;

    # Отдаём статические файлы фронтенда
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html; # Для корректной работы роутинга в SPA
    }

    # Проксируем все запросы, начинающиеся с /api/, на наш бэкенд
    location /api/ {
        set $api_upstream api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
